name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android@v3 DIHAPUS: action ini coba download
      # ulang SDK command-line tools versi baru dan macet nunggu konfirmasi lisensi.
      # Runner ubuntu-latest sudah punya Android SDK terpasang bawaan (licenses
      # sudah accepted) -> cukup pastikan sdkmanager-nya ada di PATH.
      - name: Add Android SDK cmdline-tools to PATH
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      # Sekarang install platform/build-tools 36 (Android 16), sesuai
      # compileSdk/targetSdk yang sudah dinaikkan di app/build.gradle.kts.
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install platform & build-tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      # AGP 9.1.0 minimal butuh Gradle 9.2.1.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload build reports (saat gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports
            app/build/outputs/logs
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-voicechanger-debug
          path: app/build/outputs/apk/debug/app-debug.apk
